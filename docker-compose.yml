# 서버의 /opt/bookey-web 에서 독립 프로젝트로 돈다(백엔드·어드민 Compose 와 별개). 공개 포트 3200, 컨테이너 안은 8080, 상태 확인 /health.
# 환경 변수는 같은 폴더의 .env 에서 채운다(.env.example 참고) — 스토어 링크가 생기면 값만 넣고 `docker compose up -d` 로 다시 띄우면 된다.
name: bookey-web
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3200:8080"
    environment:
      BOOKEY_API_URL: ${BOOKEY_API_URL:-https://api.bookey.site}
      SITE_URL: ${SITE_URL:-https://www.bookey.site}
      APP_STORE_URL: ${APP_STORE_URL:-}
      PLAY_STORE_URL: ${PLAY_STORE_URL:-}
      APP_STORE_ID: ${APP_STORE_ID:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@bookey.site}
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
